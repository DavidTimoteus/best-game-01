<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grid Prism: Polarity Protocol</title>
  <link rel="icon" href="data:," />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #04060e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      user-select: none;
    }
    #game {
      display: block;
      max-width: 100vw;
      max-height: 100vh;
      width: auto;
      height: auto;
      aspect-ratio: 16 / 9;
      background: #050711;
      cursor: crosshair;
      box-shadow: 0 0 48px rgba(0, 240, 255, 0.14);
    }
  </style>
</head>
<body>
  <canvas id="game" width="1280" height="720"></canvas>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
